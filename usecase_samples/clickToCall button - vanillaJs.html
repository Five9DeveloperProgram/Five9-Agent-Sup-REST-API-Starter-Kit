<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="description"
        content="Boilerplate and high-level howto guide with starter examples to use the Five9 VCC Agent and Supervisor REST API">
    <meta name="author" content="andrew.willey@five9.com">
    <!-- Include Tailwind CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.7/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <title>Five9 VCC Agent and Supervisor REST API Wrappers</title>
</head>

<body class="bg-gray-100 p-6">
    <h1 class="text-2xl font-bold mb-4">Click to Call Demo</h1>
    <div class="mb-4">
        <button class="call-external bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" targetCampaign="ob_outreach">9133259337</button>
    </div>
    <div id="message-div" class="bg-white p-4 rounded shadow-md"></div>

    <script type="text/javascript">
        class Five9Session {
            constructor() {
                this.freedomMetadataURL = "https://app.five9.com/appsvcs/rs/svc/auth/metadata";
                this.defaultXhrOptions = {
                    credentials: "include",
                    headers: { "Content-Type": "application/json" },
                };
            }

            async f9ApiMethod(endpointURL, method = "GET", payload = undefined) {
                const options = { ...this.defaultXhrOptions, method };
                if (payload !== undefined) {
                    options.body = JSON.stringify(payload);
                }
                const response = await fetch(endpointURL, options);
                if (!response.ok) {
                    throw new Error(`Five9 request failed (${response.status})`);
                }
                const text = await response.text();
                return text ? JSON.parse(text) : null;
            }

            async getSessionMetadata() {
                const metadata = await this.f9ApiMethod(this.freedomMetadataURL);
                const endpoint = metadata.metadata.dataCenters[0].apiUrls[0];
                this.f9OrgId = metadata.orgId;
                this.f9UserId = metadata.userId;
                this.base_api_url_agents = `https://${endpoint.host}:${endpoint.port}/appsvcs/rs/svc`;
            }

            /** GET /orgs/{orgId}/campaigns/{campaignId} */
            async getCampaignInfo(campaignId) {
                return this.f9ApiMethod(`${this.base_api_url_agents}/orgs/${this.f9OrgId}/campaigns/${campaignId}`);
            }

            /** GET /agents/{agentId}/campaigns_config */
            async getAgentCampaigns() {
                const response = await this.f9ApiMethod(`${this.base_api_url_agents}/agents/${this.f9UserId}/campaigns_config`);
                const campaigns = await Promise.all(response.campaignIds.map(campaignId => this.getCampaignInfo(campaignId)));
                return Object.fromEntries(campaigns.map(campaign => [campaign.name, campaign]));
            }

            /** POST /agents/{agentId}/interactions/make_external_call */
            async callExternalNumber(dnis, campaignName = null, campaignId = null) {
                if (!dnis?.trim()) {
                    throw new Error("A destination number is required");
                }
                if (campaignId == null) {
                    const campaigns = await this.getAgentCampaigns();
                    campaignId = campaigns[campaignName]?.id;
                }
                if (!campaignId) {
                    throw new Error("The selected campaign is not available to this agent");
                }
                return this.f9ApiMethod(`${this.base_api_url_agents}/agents/${this.f9UserId}/interactions/make_external_call`, "POST", {
                    number: dnis.trim(),
                    campaignId,
                });
            }
        }

        async function clickToCallButton(dnis, campaignName = null, campaignId = null) {
            const message = document.getElementById("message-div");
            try {
                const session = new Five9Session();
                message.textContent = "Connecting to Five9...";
                await session.getSessionMetadata();
                if (!campaignName && campaignId == null) {
                    const campaigns = await session.getAgentCampaigns();
                    if (Object.keys(campaigns).length === 0) {
                        throw new Error("No campaigns are available to this agent");
                    }
                    const result = await Swal.fire({
                        title: "Select a Campaign",
                        input: "select",
                        inputOptions: Object.fromEntries(Object.keys(campaigns).map(name => [name, name])),
                        inputPlaceholder: "Select a campaign",
                        showCancelButton: true,
                        inputValidator: value => value ? undefined : "Select a campaign",
                    });
                    if (!result.isConfirmed) {
                        message.textContent = "Call canceled.";
                        return;
                    }
                    campaignName = result.value;
                }
                await session.callExternalNumber(dnis, campaignName, campaignId);
                message.textContent = "Call requested.";
            } catch (error) {
                message.textContent = error.message;
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            const buttons = document.querySelectorAll(".call-external");
            buttons.forEach(function (button) {
                button.addEventListener("click", async function () {
                    button.disabled = true;
                    try {
                        await clickToCallButton(button.textContent, button.getAttribute("targetCampaign"));
                    } finally {
                        button.disabled = false;
                    }
                });
            });
        });
    </script>

</body>

</html>
